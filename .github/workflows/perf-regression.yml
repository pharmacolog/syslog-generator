# perf-regression (Issue #164, #214, #260) — ADVISORY only.
#
# Workflow: на PR в main и dev.
# - Запускает hot_path bench (3 runs, ≤15 min) с warm-up step.
# - Берёт median из 3 runs (Issue #214 — variance reduction).
# - Сравнивает с сохранённым baseline (perf/baselines/<sha>.json).
# - **ADVISORY**: post результаты в PR comment, НЕ блокирует merge.
# - Если baseline отсутствует → silent skip (autogen bootstrap, Issue #223).
#
# Issue #260 (v11.9): perf-regression перестал быть blocking gate.
# Statistics: 82% failure rate в blocking mode (chicken-and-egg с autogen).
# Решение: separation of concerns:
#   - perf-regression (this): bench + advisory comment на PR
#   - perf-monitor: post-merge + nightly regression detection + auto-Issue
#   - perf-baseline-autogen: auto-generate baseline per main HEAD (Issue #223)
#
# Per AGENTS.md §18.4 + Issue #228: maintainer обязан прогнать
# scripts/perf-local-check.sh локально перед push. Это hard rule,
# а этот workflow — только для CI visibility.

name: perf-regression

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Git SHA для baseline (по умолчанию origin/main HEAD)'
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  regression:
    # Issue #260: advisory only. Если baseline не найден — silent skip (no fail).
    # Regression detected → comment на PR + warning в job summary.
    # НЕ exit 1 на regression. НЕ exit 1 на missing baseline.
    name: Regression check (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: perf-regression-ubuntu

      - name: Resolve baseline SHA
        id: baseline_sha
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.baseline_sha }}" ]]; then
            SHA="${{ github.event.inputs.baseline_sha }}"
          else
            git fetch origin main
            SHA="$(git rev-parse origin/main)"
          fi
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "Baseline SHA: ${SHA}"

      - name: Compile benches
        run: cargo bench --no-run --locked

      - name: Test perf scripts (Issue #164 acceptance)
        run: bash scripts/tests/test_perf_scripts.sh

      - name: Warm-up (cold cache mitigation, Issue #164)
        run: |
          cargo bench --locked --bench hot_path -- --warm-up-time 1 --measurement-time 1 >/dev/null 2>&1 || true
          echo "Warm-up complete"

      - name: Generate current estimates (median of 3 runs, Issue #214)
        id: collect
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench-output
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "current_sha=${CURRENT_SHA}" >> "${GITHUB_OUTPUT}"
          BENCH_RUNS=3 scripts/perf-regression-collect.sh \
            "perf/baselines/current-${CURRENT_SHA}.json" \
            hot_path 2>&1 | tee /tmp/baseline-gen.log || {
            echo "::warning::Benchmark collection failed — skipping comparison"
            exit 0
          }

      - name: Check baseline availability
        id: check_baseline
        env:
          BASELINE_SHA: ${{ steps.baseline_sha.outputs.sha }}
        run: |
          BASELINE_FILE="perf/baselines/${BASELINE_SHA}.json"
          if [[ -f "${BASELINE_FILE}" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Baseline found at ${BASELINE_FILE}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Baseline not found at ${BASELINE_FILE} — skipping comparison (autogen will create it post-merge, Issue #223)"
          fi

      - name: Compare against baseline (advisory)
        if: steps.check_baseline.outputs.exists == 'true'
        id: compare
        env:
          BASELINE_SHA: ${{ steps.baseline_sha.outputs.sha }}
          CURRENT_SHA: ${{ steps.collect.outputs.current_sha }}
          THRESHOLD_HOT_PATH: 10
          THRESHOLD_FORMAT: 15
          THRESHOLD_TRANSPORT: 15
          THRESHOLD_ALLOC: 20
        run: |
          set -euo pipefail
          BASELINE_FILE="perf/baselines/${BASELINE_SHA}.json"
          CURRENT_FILE="perf/baselines/current-${CURRENT_SHA}.json"
          BASELINE_FILE="$BASELINE_FILE" \
          CURRENT_FILE="$CURRENT_FILE" \
          THRESHOLD_HOT_PATH="$THRESHOLD_HOT_PATH" \
          THRESHOLD_FORMAT="$THRESHOLD_FORMAT" \
          THRESHOLD_TRANSPORT="$THRESHOLD_TRANSPORT" \
          THRESHOLD_ALLOC="$THRESHOLD_ALLOC" \
          python3 - <<'PYEOF' || echo "compare_failed=true" >> "${GITHUB_OUTPUT}"
          import json, sys, os
          base_path = os.environ["BASELINE_FILE"]
          curr_path = os.environ["CURRENT_FILE"]
          with open(base_path) as f:
              base = json.load(f)
          with open(curr_path) as f:
              curr = json.load(f)
          base_e = {e["label"]: e for e in base["estimates"]}
          curr_e = {e["label"]: e for e in curr["estimates"]}
          hot_thr = float(os.environ.get("THRESHOLD_HOT_PATH", "10"))
          fmt_thr = float(os.environ.get("THRESHOLD_FORMAT", "15"))
          tra_thr = float(os.environ.get("THRESHOLD_TRANSPORT", "15"))
          alloc_thr = float(os.environ.get("THRESHOLD_ALLOC", "20"))
          def category(label):
              group = label.split("/", 1)[0]
              if group == "hot_path":
                  return ("hot_path", hot_thr)
              if group.startswith("format"):
                  return ("format", fmt_thr)
              if group.startswith("transport"):
                  return ("transport", tra_thr)
              if group.startswith("alloc") or "allocation" in label:
                  return ("allocations", alloc_thr)
              return ("other", hot_thr)
          regressions = []
          improvements = []
          for label, b in base_e.items():
              if label not in curr_e:
                  continue
              c = curr_e[label]
              if b["time_ns_median"] == 0:
                  continue
              delta = (c["time_ns_median"] - b["time_ns_median"]) / b["time_ns_median"] * 100.0
              cat, thr = category(label)
              if delta > thr:
                  regressions.append((label, cat, delta, thr, b["time_ns_median"], c["time_ns_median"]))
              elif delta < -thr:
                  improvements.append((label, cat, delta, thr, b["time_ns_median"], c["time_ns_median"]))
          print(f"\n=== Perf regression advisory ===", flush=True)
          print(f"Baseline: {base_path}", flush=True)
          print(f"Current:  {curr_path}", flush=True)
          print(f"Thresholds: hot_path={hot_thr}%, format={fmt_thr}%, transport={tra_thr}%, allocations={alloc_thr}%", flush=True)
          print(f"Regressions ({len(regressions)}):", flush=True)
          for label, cat, delta, thr, b_ns, c_ns in regressions:
              print(f"  REGRESS [{cat}] {label}: {b_ns:.0f}ns → {c_ns:.0f}ns (+{delta:.1f}%, threshold +{thr}%)", flush=True)
          print(f"Improvements ({len(improvements)}):", flush=True)
          for label, cat, delta, thr, b_ns, c_ns in improvements[:20]:
              print(f"  IMPROVE [{cat}] {label}: {b_ns:.0f}ns → {c_ns:.0f}ns ({delta:.1f}%)", flush=True)
          if regressions:
              print(f"\n⚠️ ADVISORY: {len(regressions)} regression(s) detected (informational, NOT blocking)", flush=True)
              # Write regression report for PR comment step
              with open("/tmp/regression-report.md", "w") as f:
                  f.write(f"## ⚠️ Performance regression detected\n\n")
                  f.write(f"Baseline: `{os.environ['BASELINE_SHA'][:10]}` (median-of-{base.get('n_runs', '?')})\n")
                  f.write(f"Current: `{os.environ['CURRENT_SHA'][:10]}` (median-of-{curr.get('n_runs', '?')})\n")
                  f.write(f"Thresholds: hot_path={hot_thr}%, format={fmt_thr}%, transport={tra_thr}%, allocations={alloc_thr}%\n\n")
                  f.write(f"### Regressions ({len(regressions)})\n\n")
                  for label, cat, delta, thr, b_ns, c_ns in regressions:
                      f.write(f"- **{cat}** `{label}`: {b_ns:.0f}ns → {c_ns:.0f}ns (+{delta:.1f}%, threshold +{thr}%)\n")
                  if improvements:
                      f.write(f"\n### Improvements ({len(improvements)})\n\n")
                      for label, cat, delta, thr, b_ns, c_ns in improvements[:10]:
                          f.write(f"- **{cat}** `{label}`: {b_ns:.0f}ns → {c_ns:.0f}ns ({delta:.1f}%)\n")
                  f.write(f"\n### Action items\n\n")
                  f.write(f"Per AGENTS.md §18.4 + Issue #228: maintainer must run `bash scripts/perf-local-check.sh` locally.\n")
                  f.write(f"If regression is justified (new feature with trade-off): document in PR body.\n")
                  f.write(f"perf-monitor workflow will create Issue on post-merge if regression > +5%.\n")
              # Set output for downstream comment step
              with open("/tmp/regression-detected.txt", "w") as f:
                  f.write("true")
          else:
              print(f"\n✅ ADVISORY: no regressions exceed threshold", flush=True)
              with open("/tmp/regression-detected.txt", "w") as f:
                  f.write("false")
          PYEOF

      - name: Comment on PR with bench results
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          REGRESSION_DETECTED=$(cat /tmp/regression-detected.txt 2>/dev/null || echo "false")

          if [[ "${REGRESSION_DETECTED}" == "true" ]] && [[ -f "/tmp/regression-report.md" ]]; then
            BODY=$(cat /tmp/regression-report.md)
            gh pr comment "${PR_NUMBER}" --body "${BODY}" || {
              echo "::warning::Failed to comment on PR (may be duplicate or closed)"
            }
          else
            # Always comment "looks good" for transparency
            cat > /tmp/clean-comment.md <<EOF
          ## ✅ Perf benchmark passed

          Baseline: \`${{ steps.baseline_sha.outputs.sha }}:0:10\` (median-of-3)
          Current:  this PR (median-of-3)
          Threshold: hot_path +10%, format/transport +15%, allocations +20%

          No regressions detected. This is an **advisory** check — does not block merge.

          See \`docs/perf-governance.md\` for the full monitoring strategy.
          EOF
            gh pr comment "${PR_NUMBER}" --body "$(cat /tmp/clean-comment.md)" || true
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Perf regression advisory"
            echo ""
            echo "- **Baseline SHA**: \`${{ steps.baseline_sha.outputs.sha }}\`"
            echo "- **Baseline exists**: ${{ steps.check_baseline.outputs.exists }}"
            echo "- **Thresholds**: hot_path +${{ env.THRESHOLD_HOT_PATH }}%, format +${{ env.THRESHOLD_FORMAT }}%, transport +${{ env.THRESHOLD_TRANSPORT }}%, allocations +${{ env.THRESHOLD_ALLOC }}%"
            echo "- **Mode**: advisory (NOT blocking per Issue #260)"
            echo ""
            echo "Статистика issue: до Issue #260 этот workflow был blocking gate и задерживал 82% PR."
            echo "Теперь: detect → comment → no block. perf-monitor workflow обеспечивает post-merge regression detection."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-regression-logs-${{ github.event.pull_request.number || 'manual' }}
          path: /tmp/bench-output/
          if-no-files-found: ignore