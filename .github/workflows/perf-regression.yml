# PR-A6 (v10.8.0): Performance regression gate — blocking при hot-path >50%.
#
# Workflow: на PR в main и dev.
# - Запускает hot_path bench (быстро, ≤5 min) с warm-up step.
# - Сравнивает с сохранённым baseline (perf/baselines/<sha>.json).
# - Blocking exit code 1 при превышении threshold per category:
#     hot_path/    → 50%  (PLACEHOLDER, см. Issue #214)
#     format/      → 50%
#     transport/   → 50%
#     allocations/ → 50% (reserved; см. docs/perf-governance.md)
#
# Issue #164 (v11.8): теперь blocking. Если baseline file отсутствует —
# FAIL gate (а не silent skip как раньше). Это вынуждает maintainer
# создать baseline перед merge. См. docs/perf-governance.md §Refresh.
#
# Threshold 50% — PLACEHOLDER для v11.8. CI single-run variance на
# GitHub Actions runners составляет ±30-50% (cold cache, page cache,
# process scheduling). Warm-up step уменьшает variance, но всё равно
# недостаточно для reliable 5% threshold. Issue #214 планирует
# median-of-N-runs для v11.9, после чего thresholds могут быть
# ужесточены до 5%/10%/10%/15%.

name: perf-regression

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Git SHA для baseline (по умолчанию origin/main HEAD)'
        required: false

permissions:
  contents: read

jobs:
  regression:
    # Issue #164: gate теперь blocking (без continue-on-error).
    # Если baseline не найден — exit 1, чтобы привлечь внимание maintainer.
    name: Regression check (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: perf-regression-ubuntu

      - name: Resolve baseline SHA
        id: baseline_sha
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.baseline_sha }}" ]]; then
            SHA="${{ github.event.inputs.baseline_sha }}"
          else
            git fetch origin main
            SHA="$(git rev-parse origin/main)"
          fi
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "Baseline SHA: ${SHA}"

      - name: Compile benches
        run: cargo bench --no-run --locked

      - name: Test perf scripts (Issue #164 acceptance)
        # Smoke tests для scripts: проверяют syntax + happy path parse.
        # Полные тесты требуют cargo bench (запускаются в Test job).
        run: bash scripts/tests/test_perf_scripts.sh

      - name: Warm-up (cold cache mitigation, Issue #164)
        # Cargo bench на cold cache CI runner показывает ±20-30% variance
        # (file system cache, page cache, process scheduling). Warm-up прогон
        # наполняет page cache и стабилизирует variance в ±5%.
        # Это НЕ measurement — только прогрев. Output игнорируется.
        run: |
          cargo bench --locked --bench hot_path -- --warm-up-time 1 --measurement-time 1 >/dev/null 2>&1 || true
          echo "Warm-up complete"

      - name: Generate current estimates (hot_path only)
        id: collect
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench-output
          # Collect into a separate 'current-<sha>.json' file so Compare step
          # can locate the immutable baseline (which must exist in repo).
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "current_sha=${CURRENT_SHA}" >> "${GITHUB_OUTPUT}"
          scripts/perf-regression-collect.sh \
            "perf/baselines/current-${CURRENT_SHA}.json" \
            hot_path 2>&1 | tee /tmp/baseline-gen.log

      - name: Compare against baseline
        env:
          BASELINE_SHA: ${{ steps.baseline_sha.outputs.sha }}
          CURRENT_SHA: ${{ steps.collect.outputs.current_sha }}
          THRESHOLD_HOT_PATH: 50
          THRESHOLD_FORMAT: 50
          THRESHOLD_TRANSPORT: 50
          THRESHOLD_ALLOC: 50
        run: |
          set -euo pipefail
          BASELINE_FILE="perf/baselines/${BASELINE_SHA}.json"
          CURRENT_FILE="perf/baselines/current-${CURRENT_SHA}.json"
          if [[ ! -f "$BASELINE_FILE" ]]; then
            echo "::error::Baseline file not found: $BASELINE_FILE"
            echo "::error::Blocking gate — run scripts/perf-baseline.sh update ${BASELINE_SHA} locally"
            echo "::error::and commit perf/baselines/${BASELINE_SHA}.json to main."
            echo "::error::See docs/perf-governance.md for details."
            exit 1
          fi
          if [[ ! -f "$CURRENT_FILE" ]]; then
            echo "::error::Current estimates file not found: $CURRENT_FILE"
            exit 1
          fi
          BASELINE_FILE="$BASELINE_FILE" \
          CURRENT_FILE="$CURRENT_FILE" \
          THRESHOLD_HOT_PATH="$THRESHOLD_HOT_PATH" \
          THRESHOLD_FORMAT="$THRESHOLD_FORMAT" \
          THRESHOLD_TRANSPORT="$THRESHOLD_TRANSPORT" \
          THRESHOLD_ALLOC="$THRESHOLD_ALLOC" \
          python3 - <<'PYEOF'
          import json, sys, os
          base_path = os.environ["BASELINE_FILE"]
          curr_path = os.environ["CURRENT_FILE"]
          with open(base_path) as f:
              base = json.load(f)
          with open(curr_path) as f:
              curr = json.load(f)
          base_e = {e["label"]: e for e in base["estimates"]}
          curr_e = {e["label"]: e for e in curr["estimates"]}
          hot_thr = float(os.environ.get("THRESHOLD_HOT_PATH", "50"))
          fmt_thr = float(os.environ.get("THRESHOLD_FORMAT", "10"))
          tra_thr = float(os.environ.get("THRESHOLD_TRANSPORT", "10"))
          alloc_thr = float(os.environ.get("THRESHOLD_ALLOC", "15"))
          def category(label):
              group = label.split("/", 1)[0]
              if group == "hot_path":
                  return ("hot_path", hot_thr)
              if group.startswith("format"):
                  return ("format", fmt_thr)
              if group.startswith("transport"):
                  return ("transport", tra_thr)
              if group.startswith("alloc") or "allocation" in label:
                  return ("allocations", alloc_thr)
              return ("other", hot_thr)
          regressions = []
          improvements = []
          for label, b in base_e.items():
              if label not in curr_e:
                  continue
              c = curr_e[label]
              if b["time_ns_median"] == 0:
                  continue
              delta = (c["time_ns_median"] - b["time_ns_median"]) / b["time_ns_median"] * 100.0
              cat, thr = category(label)
              if delta > thr:
                  regressions.append((label, cat, delta, thr, b["time_ns_median"], c["time_ns_median"]))
              elif delta < -thr:
                  improvements.append((label, cat, delta, thr, b["time_ns_median"], c["time_ns_median"]))
          print(f"\n=== Perf regression gate ===")
          print(f"Baseline: {base_path}")
          print(f"Thresholds: hot_path={hot_thr}%, format={fmt_thr}%, transport={tra_thr}%, allocations={alloc_thr}%")
          print(f"Regressions ({len(regressions)}):")
          for label, cat, delta, thr, b_ns, c_ns in regressions:
              print(f"  REGRESS [{cat}] {label}: {b_ns:.0f}ns → {c_ns:.0f}ns (+{delta:.1f}%, threshold +{thr}%)")
          print(f"Improvements ({len(improvements)}):")
          for label, cat, delta, thr, b_ns, c_ns in improvements[:20]:
              print(f"  IMPROVE [{cat}] {label}: {b_ns:.0f}ns → {c_ns:.0f}ns ({delta:.1f}%)")
          if regressions:
              print(f"\nFAIL: {len(regressions)} regression(s) exceed threshold")
              sys.exit(1)
          print(f"\nPASS: no regressions exceed threshold")
          sys.exit(0)
          PYEOF

      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-regression-logs-${{ github.event.pull_request.number || 'manual' }}
          path: /tmp/bench-output/
          if-no-files-found: ignore
