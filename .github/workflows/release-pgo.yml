# PR-17d (v10.7.19): PGO (Profile-Guided Optimization) build для release tags.
#
# Только для `v*.*.*` tags (release builds). PR-овые CI runs используют
# обычный release profile без PGO (для скорости CI).
#
# Улучшение: ~5% throughput на hot-path bench (1.74 µs → 1.65 µs/msg).
# Полная процедура — см. docs/PERFORMANCE.md §6.
#
# v10.7.19 step 7 (PR-Q series #77):
# Использовать latest stable rustc (which builds production binary) + download
# LLVM 20 tarball (~1.9 GB) с GitHub release. LLVM 20 (raw format v11)
# совместимо с rustc 1.97 (raw format v10).
#
# Преимущества перед PR #75 (tarball-only):
# - Правильный URL: `LLVM-20.1.0-Linux-X64.tar.xz` (НЕ clang+llvm-...tar.xz
#   которая для Windows).
# - Production binary собирается на latest stable (1.97) — пользователи получают
#   все последние performance improvements, bug fixes.
# - rustc 1.95 → LLVM 22 (format v10); apt имеет only до llvm-18 (format v9) — mismatch.
#
# v11.6 follow-up (Issue #190): дополнительно собираем macOS release с
# `split-debuginfo = "packed"` (`.dSYM/`) и публикуем в GitHub Release:
#   - Linux:   syslog-generator.dwp  (для `addr2line` symbolication)
#   - macOS:   syslog-generator.dSYM.tar.gz  (для `atos` symbolication)
#   - Plus:    merged.profdata        (для reproducibility / future PGO reruns)
# Honest disclosure: PGO остаётся Linux-only (llvm-profdata toolchain непереносим
# на macOS). macOS-job делает обычный release build БЕЗ PGO, но с тем же
# profile.release.split-debuginfo="packed" (Cargo.toml:21), который эмитит
# `.dSYM/` автоматически. Debug artifacts → см. docs/installation.md §11.

name: Release PGO build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag для PGO-сборки (например, v10.7.20)'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  pgo-build:
    name: PGO build (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pgo-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Latest stable rustc (1.97 на момент 22.07.2026) — используется
          # для production binary build. Generates .profraw в raw format v10.
          components: rustfmt, clippy

      - name: Cache LLVM tarball
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /tmp/LLVM-20.1.0-Linux-X64.tar.xz
          key: llvm-20.1.0-${{ runner.os }}-pgo-v1
          restore-keys: |
            llvm-20.1.0-${{ runner.os }}-pgo-

      - name: Download matching llvm-profdata tarball
        env:
          PGO_DIR: ${{ github.workspace }}/pgo
        run: |
          set -euo pipefail
          LLVM_VER=20.1.0
          LLVM_TARBALL="LLVM-${LLVM_VER}-Linux-X64.tar.xz"
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/${LLVM_TARBALL}"
          LLVM_PATH="/tmp/${LLVM_TARBALL}"
          start=$SECONDS
          if [ -f "$LLVM_PATH" ]; then
            LLVM_SOURCE=cache
            LLVM_DOWNLOAD_SECONDS=0
          else
            echo "Downloading $LLVM_URL (~1.9 GB)..."
            curl -fSL --connect-timeout 30 --max-time 1200 "$LLVM_URL" -o "$LLVM_PATH"
            LLVM_SOURCE=fresh
            LLVM_DOWNLOAD_SECONDS=$((SECONDS - start))
          fi
          mkdir -p /tmp/llvm-bin
          tar -xJf "$LLVM_PATH" -C /tmp/llvm-bin --strip-components=1
          test -x /tmp/llvm-bin/bin/llvm-profdata
          LLVM_VERSION=$(/tmp/llvm-bin/bin/llvm-profdata --version)
          case "$LLVM_VERSION" in
            *"LLVM version ${LLVM_VER}"*) ;;
            *) echo "::error::Unexpected llvm-profdata version: $LLVM_VERSION"; exit 1 ;;
          esac
          LLVM_RUSTC_VERSION=$(rustc --version)
          {
            echo "LLVM_BIN=/tmp/llvm-bin/bin"
            echo "LLVM_SOURCE=$LLVM_SOURCE"
            echo "LLVM_DOWNLOAD_SECONDS=$LLVM_DOWNLOAD_SECONDS"
            echo "LLVM_RUSTC_VERSION=$LLVM_RUSTC_VERSION"
          } >> "$GITHUB_ENV"
          echo "$LLVM_VERSION"
          ls -la /tmp/llvm-bin/bin/llvm-profdata

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo-pgo
          cache-on-failure: true

      - name: PGO step 1/3 — build with profile-generate
        env:
          # Используем stable toolchain (установлен выше) для consistent LLVM version.
          RUSTUP_TOOLCHAIN: stable
          PGO_DIR: ${{ github.workspace }}/pgo
        run: |
          mkdir -p "$PGO_DIR"
          # -Cprofile-generate= записывает .profraw файлы в $PGO_DIR при запуске бинаря.
          RUSTFLAGS="-Cprofile-generate=$PGO_DIR" \
            cargo build --release --bench hot_path

      - name: PGO step 2/3 — run representative workload (bench)
        env:
          RUSTUP_TOOLCHAIN: stable
          PGO_DIR: ${{ github.workspace }}/pgo
        run: |
          # Прогон benches для сбора representative profile данных.
          # Используем `cargo bench --bench hot_path` (а не прямой вызов
          # ./hot_path-* binary) — criterion требует explicit bench name,
          # иначе fail "no benchmark specified". `.profraw` файлы записываются
          # в $PGO_DIR при запуске бинаря.
          RUSTFLAGS="-Cprofile-generate=$PGO_DIR" \
            cargo bench --bench hot_path -- --quick

      - name: PGO step 3/3 — merge profdata + final build
        env:
          RUSTUP_TOOLCHAIN: stable
          PGO_DIR: ${{ github.workspace }}/pgo
        run: |
          # Resolve llvm-profdata:
          # 1. `/tmp/llvm-bin/bin/llvm-profdata` (downloaded LLVM 20 tarball,
          #    matching stable rustc 1.97 raw format v10) — **PRIMARY**
          # 2. `/usr/lib/llvm-{18,17,16}/bin/llvm-profdata` (apt-installed,
          #    НЕ совместим с rustc 1.97 формат v10 — fallback only для MSRV)
          # 3. `which llvm-profdata` (apt default symlink, possible format mismatch)
          # 4. generic /usr/lib/llvm-*/bin/llvm-profdata
          LLVM_PROFDATA=""

          # Tier 1: downloaded LLVM 20 (matching stable).
          if [ -x "${LLVM_BIN:-/nonexistent}/llvm-profdata" ]; then
            LLVM_PROFDATA="${LLVM_BIN}/llvm-profdata"
          fi

          # Tier 2: apt-installed llvm-{18,17,16}.
          if [ -z "$LLVM_PROFDATA" ] || [ ! -x "$LLVM_PROFDATA" ]; then
            for v in 18 17 16; do
              if [ -x "/usr/lib/llvm-${v}/bin/llvm-profdata" ]; then
                LLVM_PROFDATA="/usr/lib/llvm-${v}/bin/llvm-profdata"
                break
              fi
            done
          fi

          # Tier 3: /usr/bin/llvm-profdata (apt default symlink).
          if [ -z "$LLVM_PROFDATA" ] || [ ! -x "$LLVM_PROFDATA" ]; then
            LLVM_PROFDATA="$(which llvm-profdata 2>/dev/null || true)"
          fi

          # Tier 4: generic versioned path.
          if [ -z "$LLVM_PROFDATA" ] || [ ! -x "$LLVM_PROFDATA" ]; then
            LLVM_PROFDATA="$(find /usr/lib -path '/usr/lib/llvm-*/bin/llvm-profdata' -type f -print -quit 2>/dev/null || true)"
          fi

          if [ ! -x "$LLVM_PROFDATA" ]; then
            echo "::error::llvm-profdata binary not found. Tried: /tmp/llvm-bin (downloaded) / llvm-{18,17,16} / which / /usr/lib/llvm-*/bin."
            exit 1
          fi
          echo "Using llvm-profdata: $LLVM_PROFDATA"
          "$LLVM_PROFDATA" --version

          # Merge .profraw → merged.profdata
          PROFRAW_COUNT=$(find "$PGO_DIR" -maxdepth 1 -type f -name '*.profraw' -print | wc -l | tr -d ' ')
          echo "::group::Merging $PROFRAW_COUNT profraw files"
          find "$PGO_DIR" -maxdepth 1 -type f -name '*.profraw' -print | head -5
          "$LLVM_PROFDATA" merge -o "$PGO_DIR/merged.profdata" "$PGO_DIR"/*.profraw
          find "$PGO_DIR" -maxdepth 1 -type f -name 'merged.profdata' -ls
          echo "::endgroup::"

          # Final build with profile-use
          echo "::group::Building optimized binary with merged.profdata"
          RUSTFLAGS="-Cprofile-use=$PGO_DIR/merged.profdata" \
            cargo build --release
          echo "::endgroup::"

          # Issue #190: assert .dwp was emitted by Cargo (profile.release has
          # split-debuginfo="packed"). On Linux this places a .dwp file next
          # to the binary. If a future profile change silently drops debug
          # symbols, the release-publish job will fail loudly at the upload
          # step rather than producing a release without symbolication data.
          if [ ! -f target/release/syslog-generator.dwp ]; then
            echo "::error::target/release/syslog-generator.dwp not found."
            echo "::error::profile.release.split-debuginfo=\"packed\" (Cargo.toml) should emit it."
            exit 1
          fi
          echo "Found .dwp: $(stat -c '%s' target/release/syslog-generator.dwp) bytes"

      - name: Verify PGO improvement (sanity bench)
        env:
          RUSTUP_TOOLCHAIN: stable
          PGO_DIR: ${{ github.workspace }}/pgo
        run: |
          echo "::group::PGO verification — bench should show ~1.65 µs/msg (vs ~1.74 без PGO)"
          # Используем уже собранный с `-Cprofile-use=$PGO_DIR/merged.profdata`
          # binary из step 3/3. cargo bench найдет binary в target/release/deps/.
          # Если bench binary не пересобран с PGO profile — sanity check покажет
          # ~1.74 µs/msg (то же что без PGO).
          cargo bench --bench hot_path -- --quick 2>&1 \
            | grep -E "rfc5424_with_faker|thrpt" \
            | head -5
          echo "::endgroup::"

      - name: Upload PGO-optimized binary + .dwp + profdata (Issue #190)
        uses: actions/upload-artifact@v4
        with:
          name: syslog-generator-pgo-${{ github.ref_name }}-linux-amd64
          path: |
            target/release/syslog-generator
            target/release/syslog-generator.dwp
            pgo/merged.profdata
          if-no-files-found: error
          retention-days: 90

      - name: Stage PGO artifacts (Issue #180.1: rename для читаемых имён в Release)
        # Промежуточный шаг: переименовываем `target/release/syslog-generator`
        # (бинарь без расширения) → `syslog-generator-pgo` (PGO marker), чтобы
        # пользовательский download URL содержал semantic PGO-suffix.
        # `merged.profdata` остаётся как есть (PGO-профиль).
        run: |
          set -euo pipefail
          mkdir -p dist-pgo
          cp target/release/syslog-generator dist-pgo/syslog-generator-pgo
          cp pgo/merged.profdata dist-pgo/merged.profdata
          ls -la dist-pgo/
          file dist-pgo/syslog-generator-pgo

      - name: Upload PGO artifacts to GitHub Release (Issue #180.1)
        # Только на tag push (не на PR-merge, не на workflow_dispatch).
        # Если не на tag — step skip (no upload).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          echo "=== PGO artifacts для upload в $TAG ==="
          ls -la dist-pgo/
          # Upload в GitHub Release: PGO бинарь + profile.
          # PGP подпись НЕ добавляется в этом PR (deferred — выделить reusable
          # sign workflow, см. Issue #180 out-of-scope).
          gh release upload "$TAG" \
            dist-pgo/syslog-generator-pgo \
            dist-pgo/merged.profdata \
            --clobber
          echo "::notice::PGO artifacts attached to release $TAG"

      - name: Summary
        if: always()
        run: |
          PROFRAW_COUNT=$(find "${{ github.workspace }}/pgo" -maxdepth 1 -type f -name '*.profraw' -print | wc -l | tr -d ' ')
          MERGED_SIZE=$(stat -c '%s' "${{ github.workspace }}/pgo/merged.profdata" 2>/dev/null || printf 'n/a')
          DWP_SIZE=$(stat -c '%s' target/release/syslog-generator.dwp 2>/dev/null || printf 'n/a')
          {
            echo "## PGO build summary"
            echo "- Tag: ${{ github.ref_name }}"
            echo "- LLVM source: ${LLVM_SOURCE:-unknown}"
            echo "- LLVM download: ${LLVM_DOWNLOAD_SECONDS:-unknown}s"
            echo "- Rust toolchain: ${LLVM_RUSTC_VERSION:-unknown}"
            echo "- Profile files: $PROFRAW_COUNT"
            echo "- Merged profdata: ${MERGED_SIZE} bytes"
            echo "- .dwp: ${DWP_SIZE} bytes (Issue #190: для addr2line symbolication)"
            echo "- See docs/PERFORMANCE.md §6 for details"
            echo "- See docs/installation.md §11 for symbolication recipes"
          } >> "$GITHUB_STEP_SUMMARY"

  pgo-build-macos:
    # Issue #190: macOS release build with split-debuginfo (emits .dSYM/).
    # Honest disclosure:
    #   - НЕ PGO: llvm-profdata toolchain Linux-only. macOS-job делает обычный
    #     release build (без PGO), но с profile.release.split-debuginfo="packed"
    #     (Cargo.toml:21), который эмитит .dSYM/ автоматически.
    #   - НЕ separate dsymutil step: Cargo вызывает dsymutil при split-debuginfo=packed
    #     на macOS targets; явный вызов был бы no-op.
    #   - macos-14 runner: arm64 (Apple Silicon). x86_64 build не делаем — Issue #190
    #     не требует multi-arch; при необходимости добавить отдельный job.
    name: Release build (macOS arm64, .dSYM)
    runs-on: macos-14
    timeout-minutes: 30
    concurrency:
      group: pgo-macos-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo-release
          cache-on-failure: true

      - name: Build release binary (split-debuginfo=packed)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          # profile.release already declares split-debuginfo="packed", so Cargo
          # invokes dsymutil automatically on macOS and emits:
          #   target/release/syslog-generator
          #   target/release/syslog-generator.dSYM/Contents/Resources/DWARF/syslog-generator
          #   target/release/syslog-generator.dSYM/Contents/Info.plist
          cargo build --release --locked
          test -x target/release/syslog-generator
          test -d target/release/syslog-generator.dSYM
          test -f target/release/syslog-generator.dSYM/Contents/Resources/DWARF/syslog-generator
          echo "Binary: $(file target/release/syslog-generator)"
          echo "DWARF:  $(file target/release/syslog-generator.dSYM/Contents/Resources/DWARF/syslog-generator)"
          BIN_SIZE=$(stat -f '%z' target/release/syslog-generator)
          DWARF_SIZE=$(stat -f '%z' target/release/syslog-generator.dSYM/Contents/Resources/DWARF/syslog-generator)
          echo "binary=${BIN_SIZE} bytes; dwarf=${DWARF_SIZE} bytes"

      - name: Package .dSYM as tarball (Issue #190)
        run: |
          # gh release upload принимает individual files, не directories.
          # .dSYM — это bundle directory; пакуем в tar.gz чтобы release-asset
          # оставался самодостаточным (Info.plist + DWARF + resources).
          # Альтернатива: положить .dSYM в symbolic-link tree в sparse-checkout,
          # но tar.gz — стандартный формат для macOS debug bundles.
          tar -C target/release -czf syslog-generator.dSYM.tar.gz syslog-generator.dSYM
          ls -la syslog-generator.dSYM.tar.gz
          tar -tzf syslog-generator.dSYM.tar.gz

      - name: Upload macOS binary + .dSYM tarball (Issue #190)
        uses: actions/upload-artifact@v4
        with:
          name: syslog-generator-release-${{ github.ref_name }}-macos-arm64
          path: |
            target/release/syslog-generator
            syslog-generator.dSYM.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          BIN_SIZE=$(stat -f '%z' target/release/syslog-generator 2>/dev/null || printf 'n/a')
          DSYM_DWARF="target/release/syslog-generator.dSYM/Contents/Resources/DWARF/syslog-generator"
          DSYM_SIZE=$(stat -f '%z' "$DSYM_DWARF" 2>/dev/null || printf 'n/a')
          TARBALL_SIZE=$(stat -f '%z' syslog-generator.dSYM.tar.gz 2>/dev/null || printf 'n/a')
          {
            echo "## macOS release build summary (Issue #190)"
            echo "- Tag: ${{ github.ref_name }}"
            echo "- binary: ${BIN_SIZE} bytes"
            echo "- .dSYM DWARF blob: ${DSYM_SIZE} bytes"
            echo "- .dSYM.tar.gz: ${TARBALL_SIZE} bytes"
            echo "- .dSYM/Contents/Info.plist присутствует: $(test -f target/release/syslog-generator.dSYM/Contents/Info.plist && echo yes || echo no)"
            echo "- Symbolication через \`atos -o <dwarf> <addr>\` (см. docs/installation.md §11)"
          } >> "$GITHUB_STEP_SUMMARY"

  release-publish:
    # Issue #190: aggregate Linux .dwp + macOS .dSYM + PGO profdata и attach
    # к GitHub Release. Только tag push (workflow_dispatch — debug сборки,
    # которые не должны трогать public release).
    name: Upload debug artifacts to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pgo-build, pgo-build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux PGO artifact (binary + .dwp + profdata)
        uses: actions/download-artifact@v4
        with:
          name: syslog-generator-pgo-${{ github.ref_name }}-linux-amd64
          path: artifacts/linux-amd64/

      - name: Download macOS release artifact (binary + .dSYM.tar.gz)
        uses: actions/download-artifact@v4
        with:
          name: syslog-generator-release-${{ github.ref_name }}-macos-arm64
          path: artifacts/macos-arm64/

      - name: Verify required debug artifacts (Issue #190)
        run: |
          set -euo pipefail
          required=(
            artifacts/linux-amd64/syslog-generator
            artifacts/linux-amd64/syslog-generator.dwp
            artifacts/linux-amd64/merged.profdata
            artifacts/macos-arm64/syslog-generator
            artifacts/macos-arm64/syslog-generator.dSYM.tar.gz
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required artifact: $f"
              exit 1
            fi
          done
          echo "All $(printf '%s\n' "${required[@]}" | wc -l | tr -d ' ') required artifacts present."

      - name: List collected artifacts
        run: |
          echo "## artifacts/linux-amd64"
          ls -la artifacts/linux-amd64/
          echo
          echo "## artifacts/macos-arm64"
          ls -la artifacts/macos-arm64/

      - name: Upload debug artifacts to GitHub Release (Issue #190)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Если release уже создан packages.yml (типичный flow), используем его.
          # Если ещё нет (race condition между workflows), создаём draft.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not yet created; packages.yml may still be running."
            echo "Creating draft release as fallback."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --draft
          fi

          # Upload .dwp/.dSYM/profdata/binary. Имена уникальны (per-target) и
          # не конфликтуют с artifacts от packages.yml (.deb/.rpm/.apk/SHA256SUMS).
          # `--clobber` перезаписывает если уже залит (re-run workflow).
          gh release upload "$TAG" --clobber \
            artifacts/linux-amd64/syslog-generator \
            artifacts/linux-amd64/syslog-generator.dwp \
            artifacts/linux-amd64/merged.profdata \
            artifacts/macos-arm64/syslog-generator \
            artifacts/macos-arm64/syslog-generator.dSYM.tar.gz

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release debug artifacts uploaded (Issue #190)"
            echo "- Tag: ${{ github.ref_name }}"
            echo "- Linux:   syslog-generator, syslog-generator.dwp, merged.profdata"
            echo "- macOS:   syslog-generator, syslog-generator.dSYM.tar.gz"
            echo "- Symbolication: см. docs/installation.md §11"
          } >> "$GITHUB_STEP_SUMMARY"
