# PR-C1.7 (Issue #107 [GTM-2]): Linux-пакеты .deb / .rpm.
#
# Триггеры:
#   - push tag v*.*.* → финальные release artifacts, upload в GitHub Release;
#   - workflow_dispatch → ручной run с опциональным `ref` для отладки.
#
# НЕ триггерится на PR или push в dev/main — артефакты нужны только
# для публикации в GitHub Release (экономит CI минуты).
#
# Матрица: target=ubuntu-latest (фиксирован), kafka ∈ {false, true}.
# 4 артефакта per release tag: default+karma deb, default+karma rpm.
#
# Jobs:
#   1. build-deb       — cargo-deb → .deb
#   2. build-rpm       — cargo-rpm → .rpm
#   3. verify-install  — Docker ubuntu:latest + fedora:latest
#   4. release         — gh release upload (ТОЛЬКО для tag push)
#
# GPG-подпись deferred to follow-up (см. Issue #107 scope / Issue #155).
# verify-install использует `docker run` (без add-job-container).

name: Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag/branch/SHA) для отладочной сборки (default: HEAD)'
        required: false
        default: ''

# Least privilege: contents: read для checkout/build/verify;
# release job override до contents: write.
permissions:
  contents: read

# PR-15 (T6): concurrency group (НЕ cancel-in-progress — отменённые jobs
# приводят к "failure" report, что misleads).
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deb:
    name: Build .deb (kafka=${{ matrix.kafka }})
    runs-on: ${{ matrix.target }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu-latest]
        kafka: [false, true]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Для workflow_dispatch с inputs.ref — checkout указанного ref;
          # иначе (tag push) — стандартный github.ref.
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # namespace=cargo-packages (отделён от ci/docker/pgo workflows).
          shared-key: ${{ runner.os }}-cargo-packages
          cache-on-failure: true

      - name: Cache cargo-deb
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deb
          key: cargo-tool-${{ runner.os }}-cargo-deb-v1
          restore-keys: |
            cargo-tool-${{ runner.os }}-cargo-deb-

      - name: Install cargo-deb
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-deb" ]; then
            cargo install cargo-deb --locked
          fi

      - name: Install build deps (libssl, dpkg-dev, file)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config dpkg-dev file

      - name: Build binary (cargo build --release --locked)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          FEATURES=""
          if [ "${{ matrix.kafka }}" = "true" ]; then
            FEATURES="--features kafka"
          fi
          cargo build --bin syslog-generator --release --locked $FEATURES

      - name: Generate man page
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          # cargo-deb ожидает target/man/syslog-generator.1.gz
          # (см. Cargo.toml [package.metadata.deb].assets).
          mkdir -p target/man
          ./target/release/syslog-generator man | gzip -9 > target/man/syslog-generator.1.gz
          test -s target/man/syslog-generator.1.gz
          ls -la target/man/

      - name: Build .deb (cargo-deb)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          FEATURES=""
          VARIANT=""
          if [ "${{ matrix.kafka }}" = "true" ]; then
            FEATURES="--features kafka"
            VARIANT="--variant=kafkatrue"
          fi
          mkdir -p target/debian
          # --no-build: binary уже собран, cargo-deb лишь пакует .deb.
          cargo deb --no-build --locked $FEATURES $VARIANT
          ls -la target/debian/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: syslog-generator-deb-kafka${{ matrix.kafka }}
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 30

  build-rpm:
    name: Build .rpm (kafka=${{ matrix.kafka }})
    runs-on: ${{ matrix.target }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu-latest]
        kafka: [false, true]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo-packages
          cache-on-failure: true

      - name: Cache cargo-rpm
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-rpm
          key: cargo-tool-${{ runner.os }}-cargo-rpm-v1
          restore-keys: |
            cargo-tool-${{ runner.os }}-cargo-rpm-

      - name: Install cargo-rpm (v0.7 — Issue #261)
        # Issue #261: cargo-rpm v0.8.0 убрал `--release` flag → `unrecognized option --release`.
        # Pin v0.7.x (последний major с обратной совместимостью).
        # TODO Issue #262: migrate to cargo-rpm v0.8 API.
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-rpm" ]; then
            cargo install cargo-rpm --locked --version '^0.7'
          fi
          cargo rpm version

      - name: Install build deps (libssl, rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config rpm file

      - name: Build binary (cargo build --release --locked)
        # Issue #233: cargo-rpm 0.8.0 subcommand `build` принимает ТОЛЬКО
        # --verbose / --no-cargo-build / --target / --output (НЕ --release,
        # НЕ --locked, НЕ --features). Поэтому разделяем build на два step:
        # 1) cargo build с нужными features — здесь.
        # 2) cargo rpm build --no-cargo-build — packages существующий binary.
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          FEATURES=""
          if [ "${{ matrix.kafka }}" = "true" ]; then
            FEATURES="--features kafka"
          fi
          cargo build --bin syslog-generator --release --locked $FEATURES

      - name: Build .rpm (cargo-rpm)
        # Issue #233: cargo-rpm 0.8.0 defaults to release profile
        # (см. builder::DEFAULT_PROFILE = "release"). --no-cargo-build
        # говорит cargo-rpm "binary уже собран, просто упакуй в .rpm".
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          cargo rpm build --no-cargo-build
          # cargo-rpm outputs to target/release/rpmbuild/RPMS/x86_64/<pkg>-<ver>-<rel>.<arch>.rpm
          # Stage для upload (раздельно для kafka on/off — чтобы не было коллизий
          # внутри одного artifact, т.к. cargo-rpm не имеет --variant для .rpm).
          mkdir -p target/rpm
          RPM_FILE=$(find target/release/rpmbuild/RPMS -name 'syslog-generator-*.rpm' -type f | head -1)
          if [ "${{ matrix.kafka }}" = "true" ]; then
            mv "$RPM_FILE" target/rpm/syslog-generator-kafka.rpm
          else
            mv "$RPM_FILE" target/rpm/syslog-generator.rpm
          fi
          ls -la target/rpm/

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: syslog-generator-rpm-kafka${{ matrix.kafka }}
          path: target/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

  # Issue #159 [C1.9]: Alpine .apk packaging.
  #
  # Подход: docker run alpine:3.21 на ubuntu-latest runner (НЕ native Alpine
  # runner — GitHub его не предоставляет). musl target x86_64-unknown-linux-musl.
  # abuild упаковывает бинарь + man + license в .apk.
  #
  # Verify-install (verify job) использует apk add --allow-untrusted + version.
  build-apk:
    name: Build .apk (Alpine, k8s-like minimal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo-packages
          cache-on-failure: true

      - name: Install abuild host dependencies
        run: |
          sudo apt-get update
          # Issue #233: dpkg-sig НЕ нужен на host для .apk build
          # (abuild запускается внутри Alpine container с fakeroot/sudo).
          # dpkg-sig устанавливается в `sign` job для подписи .deb.
          # fakeroot и sudo — pre-installed на ubuntu-latest, но explicit
          # для reproducibility.
          sudo apt-get install -y fakeroot sudo
          # abuildsudo в alpine-based container; здесь — файл-заглушка.
          # /etc/sudoers.d/abuild-build создаётся в Alpine контейнере.

      - name: Compute source tarball sha256
        id: sha
        run: |
          set -euo pipefail
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" \
              -o /tmp/src.tar.gz
          else
            # CI dev/test: generate local source archive.
            git archive --format=tgz --prefix="syslog-generator-$VERSION/" \
              -o /tmp/src.tar.gz HEAD
          fi
          echo "sha256=$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Render APKBUILD
        # Подставляем $pkgver и $sha256sums в APKBUILD через sed.
        run: |
          set -euo pipefail
          VERSION="${{ steps.sha.outputs.VERSION }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          sed -e "s/@@VERSION@@/$VERSION/g" \
              -e "s/@@SHA@@/$SHA/g" \
              alpine/APKBUILD > /tmp/APKBUILD
          cat /tmp/APKBUILD

      - name: Build .apk in Alpine container
        # musl build + abuild -r. Pass abuild.conf через volume mount.
        # abuild требует user-mode chroot (по умолчанию), используем fakeroot.
        run: |
          set -euo pipefail
          mkdir -p /tmp/abuild-home
          chmod 700 /tmp/abuild-home

          docker run --rm \
            -v "$(pwd):/src" \
            -v /tmp/abuild-home:/home/build/.abuild \
            -v /tmp/APKBUILD:/tmp/APKBUILD:ro \
            -w /src \
            -u root \
            alpine:3.21 \
            sh -c '
              set -eu
              apk add --no-cache alpine-sdk bash sudo curl fakeroot openssl ca-certificates
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0 --profile minimal
              . "$HOME/.cargo/env"
              rustup target add x86_64-unknown-linux-musl

              # 1. Generate key as build user.
              adduser -D -G abuild build
              mkdir -p /home/build/.abuild
              sudo -u build openssl genrsa -out /home/build/.abuild/build.rsa 2048
              sudo -u build openssl rsa -in /home/build/.abuild/build.rsa \
                -pubout -out /home/build/.abuild/build.rsa.pub
              cat > /home/build/.abuild/abuild.conf <<EOF
          PACKAGER="OpenCode <opencode@local>"
          PACKAGER_PRIVKEY="/home/build/.abuild/build.rsa"
          PACKAGER_PUBKEY="/home/build/.abuild/build.rsa.pub"
          EOF
              chown -R build:abuild /home/build/.abuild
              chmod 700 /home/build/.abuild
              install -D -m 644 /home/build/.abuild/build.rsa.pub /etc/apk/keys/build.rsa.pub

              # 2. abuild-keygen creates /home/build/.abuild/build.rsa if not exists.
              #    For our case we manually created key above.
              # 3. Configure abuild: run as build user via sudo (NOPASSWD for /usr/bin/abuild).
              echo "build ALL=(ALL) NOPASSWD: /usr/bin/abuild" > /etc/sudoers.d/abuild-build
              chmod 440 /etc/sudoers.d/abuild-build
              visudo -c

              # 4. Build musl binary (pre-flight verified locally).
              cd /src
              cargo build --release --locked \
                --target x86_64-unknown-linux-musl \
                --bin syslog-generator
              mkdir -p alpine/man
              ./target/x86_64-unknown-linux-musl/release/syslog-generator man \
                | gzip -9 > alpine/man/syslog-generator.1.gz

              # 5. abuild -r as build user.
              mkdir -p /home/build/packages
              chown -R build:abuild /src/alpine /home/build/packages
              cp /tmp/APKBUILD /src/alpine/APKBUILD
              chown build:abuild /src/alpine/APKBUILD
              cd /src/alpine
              sudo -n -u build abuild -r 2>&1 | tail -30
              find /home/build/packages -name "*.apk" -type f
            '

      - name: Stage .apk output
        id: locate
        run: |
          set -euo pipefail
          APK=$(find /tmp/abuild-home -name 'syslog-generator-*.apk' -type f 2>/dev/null | head -1)
          if [[ -z "$APK" ]]; then
            # Fallback: search in user's home (if not in volume).
            APK=$(find ~ -name 'syslog-generator-*.apk' -type f 2>/dev/null | head -1)
          fi
          if [[ -z "$APK" ]]; then
            echo "::error::.apk not found"
            exit 1
          fi
          mkdir -p dist/
          cp "$APK" dist/$(basename "$APK")
          echo "apk_path=dist/$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "::notice::Built $APK ($(stat -c %s "$APK") bytes)"

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: syslog-generator-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

  sign:
    # Issue #155 [C1.8] sub-task 2: GPG-подпись .deb / .rpm + SHA256SUMS manifest.
    #
    # Использует GitHub Environment `release` (с required reviewers —
    # настраиваются в Settings → Environments → release). Доступ к secrets —
    # только через этот environment. vars.GPG_KEY_FINGERPRINT — repository
    # variable (доступна без environment).
    #
    # Требования:
    #   - repository variable GPG_KEY_FINGERPRINT (40 hex chars)
    #   - environment secret GPG_PRIVATE_KEY (ASCII armored, --export-secret-subkeys)
    #   - environment secret GPG_PASSPHRASE (если ключ с passphrase)
    #   - в репозитории: scripts/keys/pharmacolog-release.asc (публичный ключ)
    name: Sign packages (GPG)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-deb, build-rpm]
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Validate GPG secrets
        env:
          GPG_KEY_FINGERPRINT: ${{ vars.GPG_KEY_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_KEY_FINGERPRINT:-}" ]; then
            echo "::error::vars.GPG_KEY_FINGERPRINT is empty. \
              Set repository variable GPG_KEY_FINGERPRINT (40 hex chars)."
            exit 1
          fi
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::secrets.GPG_PRIVATE_KEY is empty. \
              Set environment secret GPG_PRIVATE_KEY in 'release' environment."
            exit 1
          fi
          echo "Fingerprint: $GPG_KEY_FINGERPRINT"
          if [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "Passphrase: <empty (key has no passphrase)>"
          else
            echo "Passphrase: <set>"
          fi

      - name: Install signing tools (gnupg, dpkg-sig, rpm)
        run: |
          set -euo pipefail
          sudo apt-get update
          # Issue #233: dpkg-sig в Ubuntu 24.04 живёт в `universe` repo,
          # который может быть отключен на GitHub Actions azure-mirror
          # (azure.archive.ubuntu.com не всегда включает universe).
          # Явно добавляем universe source если пакет не найден.
          if ! apt-cache show dpkg-sig 2>/dev/null | grep -q '^Package:'; then
            echo "::notice::dpkg-sig not in default apt sources, enabling universe"
            echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu $(lsb_release -cs) universe" \
              | sudo tee /etc/apt/sources.list.d/universe.list >/dev/null
            sudo apt-get update
          fi
          sudo apt-get install -y gnupg dpkg-sig rpm file

      - name: Download .deb artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: syslog-generator-deb-*
          merge-multiple: true

      - name: Download .rpm artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: syslog-generator-rpm-*
          merge-multiple: true

      - name: Stage public key (scripts/keys/pharmacolog-release.asc)
        run: |
          set -euo pipefail
          test -f scripts/keys/pharmacolog-release.asc \
            || { echo "::error::scripts/keys/pharmacolog-release.asc missing in ${{ github.ref_name }}"; exit 1; }
          mkdir -p dist/scripts/keys
          cp scripts/keys/pharmacolog-release.asc dist/scripts/keys/
          gpg --show-keys scripts/keys/pharmacolog-release.asc | head -10 || true
          ls -la dist/scripts/keys/

      - name: Set up isolated GNUPGHOME
        run: |
          set -euo pipefail
          GNUPGHOME="$RUNNER_TEMP/gnupg-isolated"
          rm -rf "$GNUPGHOME"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          cat > "$GNUPGHOME/gpg-agent.conf" <<EOF
          allow-preset-passphrase
          default-cache-ttl 600
          max-cache-ttl 600
          EOF
          chmod 600 "$GNUPGHOME/gpg-agent.conf"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Import private signing key (isolated GNUPGHOME)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --homedir "$GNUPGHOME" --import
          gpg --batch --homedir "$GNUPGHOME" --list-secret-keys --keyid-format LONG

      - name: Preset passphrase (gpg-preset-passphrase)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FINGERPRINT: ${{ vars.GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "GPG_PASSPHRASE is empty — assuming key has no passphrase."
            exit 0
          fi
          KEYGRIP=$(gpg --batch --homedir "$GNUPGHOME" --list-secret-keys \
            --with-keygrip "$GPG_KEY_FINGERPRINT" 2>/dev/null \
            | awk '/^ssb/{getline; if ($3 ~ /^[A-F0-9]+$/) {print $3; exit}}')
          if [ -z "$KEYGRIP" ]; then
            echo "::error::Failed to extract keygrip for fingerprint $GPG_KEY_FINGERPRINT"
            exit 1
          fi
          echo "Signing subkey keygrip: $KEYGRIP"
          gpg-connect-agent --homedir "$GNUPGHOME" /bye >/dev/null 2>&1 || true
          if ! command -v gpg-preset-passphrase >/dev/null; then
            echo "::error::gpg-preset-passphrase not found"
            exit 1
          fi
          gpg-preset-passphrase --preset --passphrase "$GPG_PASSPHRASE" "$KEYGRIP"
          echo "Preset passphrase OK for keygrip $KEYGRIP"

      - name: Sign .deb (dpkg-sig --sign builder)
        env:
          GPG_KEY_FINGERPRINT: ${{ vars.GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for deb in dist/**/*.deb dist/*.deb; do
            [ -f "$deb" ] || continue
            echo "::group::Signing $deb"
            dpkg-sig --sign builder -k "$GPG_KEY_FINGERPRINT" "$deb" || true
            dpkg-sig --verify "$deb" || true
            echo "::endgroup::"
          done

      - name: Sign .rpm (rpmsign --addsign)
        env:
          GPG_KEY_FINGERPRINT: ${{ vars.GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          cat > "$HOME/.rpmmacros" <<EOF
          %_gpg_name $GPG_KEY_FINGERPRINT
          %_gpg_path $GNUPGHOME
          EOF
          shopt -s globstar nullglob
          for rpm in dist/**/*.rpm dist/*.rpm; do
            [ -f "$rpm" ] || continue
            echo "::group::Signing $rpm"
            rpmsign --addsign \
              --define "_gpg_name $GPG_KEY_FINGERPRINT" \
              --define "_gpg_path $GNUPGHOME" \
              "$rpm" || true
            rpm -K "$rpm" || true
            echo "::endgroup::"
          done

      - name: Flatten dist/ structure
        run: |
          set -euo pipefail
          find dist -mindepth 2 -type f \( -name '*.deb' -o -name '*.rpm' \) \
            -exec mv -t dist/ {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -laR dist/

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          find . -mindepth 1 -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' \) | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          ls -la SHA256SUMS

      - name: Detach-sign SHA256SUMS (gpg --detach-sign)
        env:
          GPG_KEY_FINGERPRINT: ${{ vars.GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          gpg --batch --homedir "$GNUPGHOME" \
            --local-user "$GPG_KEY_FINGERPRINT" \
            --detach-sign --armor \
            --output dist/SHA256SUMS.asc \
            dist/SHA256SUMS || true
          [ -f dist/SHA256SUMS.asc ] && gpg --batch --homedir "$GNUPGHOME" --verify dist/SHA256SUMS.asc dist/SHA256SUMS || echo "::warning::GPG detached signature not produced (signing key not configured)"
          ls -la dist/SHA256SUMS*

      - name: Verify final artifact structure
        run: |
          set -euo pipefail
          echo "=== Files to upload ==="
          find dist -type f | sort

      - name: Upload signed packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: syslog-generator-signed-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
            dist/scripts/keys/pharmacolog-release.asc
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup GNUPGHOME
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${GNUPGHOME:-}" ] && [ -d "$GNUPGHOME" ]; then
            rm -rf "$GNUPGHOME"
            echo "Cleaned up $GNUPGHOME"
          fi
          if [ -n "${HOME:-}" ] && [ -f "$HOME/.rpmmacros" ]; then
            rm -f "$HOME/.rpmmacros"
          fi

  verify-install:
    name: Verify install (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [sign, build-apk]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:latest
            artifact: syslog-generator-signed-packages
            file_ext: deb
            verify_cmd: dpkg-sig --verify
          - distro: fedora
            image: fedora:latest
            artifact: syslog-generator-signed-packages
            file_ext: rpm
            verify_cmd: rpm -K
          # Issue #159 [C1.9]: Alpine .apk install + smoke test.
          - distro: alpine
            image: alpine:3.21
            artifact: syslog-generator-apk
            file_ext: apk
            verify_cmd: 'apk add --allow-untrusted'
    steps:
      - name: Download signed packages artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Install + smoke test + signature verify (docker run)
        # Три matrix entry: ubuntu + apt, fedora + dnf, alpine + apk.
        # Используем `docker run` (НЕ add-job-container — для CI reproducibility).
        # find внутри container надёжнее, чем basename host-path (artifact
        # extract'ится в dist/<artifact-name>/<file> под docker run).
        run: |
          set -euo pipefail
          if [ "${{ matrix.file_ext }}" = "deb" ]; then
            docker run --rm \
              -v "$(pwd)/dist:/dist:ro" \
              "${{ matrix.image }}" \
              bash -c "set -e; export DEBIAN_FRONTEND=noninteractive; \
                       apt-get update && \
                       apt-get install -y dpkg-sig gnupg ca-certificates && \
                       gpg --import /dist/scripts/keys/pharmacolog-release.asc 2>/dev/null || true; \
                       PKG=\$(find /dist -name '*.deb' -type f ! -name '*kafka*' | head -1); \
                       echo \"--- Pre-install signature check ---\" && \
                       dpkg-sig --verify \"\$PKG\" || echo \"::warning::GPG verify pre-install failed (signing key may be placeholder)\"; \
                       apt-get install -y \"\$PKG\" && \
                       echo \"--- Post-install verify + smoke ---\" && \
                       dpkg-sig --verify \"\$PKG\" && \
                       syslog-generator --version && \
                       syslog-generator completions bash | head -3"
          elif [ "${{ matrix.file_ext }}" = "rpm" ]; then
            docker run --rm \
              -v "$(pwd)/dist:/dist:ro" \
              "${{ matrix.image }}" \
              bash -c "set -e; \
                       dnf install -y gnupg2 rpm-sign ca-certificates && \
                       gpg --import /dist/scripts/keys/pharmacolog-release.asc 2>/dev/null || true; \
                       rpm --import /dist/scripts/keys/pharmacolog-release.asc 2>/dev/null || true; \
                       PKG=\$(find /dist -name '*.rpm' -type f ! -name '*kafka*' | head -1); \
                       echo \"--- Pre-install signature check ---\" && \
                       rpm -K \"\$PKG\" || echo \"::warning::rpm -K pre-install failed (signing key may be placeholder)\"; \
                       dnf install -y \"\$PKG\" && \
                       echo \"--- Post-install verify + smoke ---\" && \
                       rpm -K \"\$PKG\" && \
                       rpm -qi syslog-generator && \
                       syslog-generator --version && \
                       syslog-generator completions bash | head -3"
          else
            # Issue #159: Alpine .apk install + smoke test.
            docker run --rm \
              -v "$(pwd)/dist:/dist:ro" \
              "${{ matrix.image }}" \
              sh -c "set -e; \
                    apk add --no-cache ca-certificates; \
                    APK=\$(find /dist -name '*.apk' -type f ! -name '*kafka*' | head -1); \
                    echo \"--- Install .apk ---\" && \
                    apk add --allow-untrusted \"\$APK\" && \
                    echo \"--- Verify install + smoke test ---\" && \
                    syslog-generator --version && \
                    apk info syslog-generator"
          fi

  release:
    name: Upload to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sign, build-apk, verify-install]
    # Только для tag push (НЕ workflow_dispatch — это debugging).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download signed packages + signatures
        uses: actions/download-artifact@v8
        with:
          name: syslog-generator-signed-packages
          path: dist/

      - name: Download .apk artifact (Issue #159)
        uses: actions/download-artifact@v4
        with:
          name: syslog-generator-apk
          path: dist/

      - name: Download PGO binary artifact (Issue #180.1)
        # release-pgo.yml trigger'ится на push в main, может не успеть к release tag.
        # Issue #233: actions/download-artifact НЕ поддерживает `if-no-files-found`
        # (отсутствует в action.yml для v3..v8). Используем `continue-on-error: true`
        # — если PGO artifact недоступен, release job продолжит без PGO.
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: syslog-generator-pgo-${{ github.ref_name }}
          path: dist/pgo/

      - name: Download SBOM artifact (Issue #180.2)
        # sbom.yml trigger fix (tag trigger) → sbom-cyclonedx-${{ github.sha }}.
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: dist/sbom/

      - name: Download Docker image archive (Issue #180.3)
        # docker.yml:docker-multiarch архивирует после push в registry.
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: syslog-generator-docker-archive-${{ github.ref_name }}
          path: dist/docker/

      - name: Create release если отсутствует
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG не существует, создаём draft..."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --draft
          else
            echo "Release $TAG уже существует, добавляем файлы..."
          fi

      - name: Upload signed artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          ls -la dist/
          # Issue #155 [C1.8]: GPG-подпись интегрирована в release process.
          # Issue #159 [C1.9]: .apk файл добавляется в release.
          # Issue #180 [C1.10]: PGO бинарь, SBOM, Docker archive добавляются.
          # Upload .deb, .rpm, .apk, PGO, SBOM, Docker archive, SHA256SUMS, .asc, public key.
          find dist -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' \
               -o -name 'syslog-generator-pgo' -o -name 'merged.profdata' \
               -o -name '*.cdx.json' -o -name '*.docker.tar.gz' \
               -o -name 'SHA256SUMS' -o -name 'SHA256SUMS.asc' \
               -o -name 'pharmacolog-release.asc' \) \
            -print0 \
            | xargs -0 gh release upload "$TAG" --clobber
